# Build Anchor and Tag firmware.
#  - pull request to main: build, upload the images as a CI artifact, and fail
#    if an image differs from the image already released under the same
#    VERSION (a changed image needs a bump in main.h; an identical one doesn't).
#  - push to main (a merged PR): build and publish a GitHub release
#    fw-anc<ver>-tag<ver> whose single asset is htn-fw-anc<ver>-tag<ver>.zip
#    (anchor/<ver>/ and tag/<ver>/ with .bin/.hex/.elf/manifest.json). If the
#    release already exists (no version bump), only the zip is made sure of.
#
# The toolchain is Ubuntu 24.04's gcc-arm-none-eabi 13.2.rel1, the same one the
# local tools/build.sh builds were made and tested with.
name: firmware

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          arm-none-eabi-gcc --version | head -1
          python3 -m venv tools/htn_fota/.venv
          tools/htn_fota/.venv/bin/pip install -r tools/htn_fota/requirements.txt

      - name: Build Anchor
        run: tools/htn_fota/.venv/bin/python tools/htn_fota/fw_release.py build anchor --note "CI ${{ github.sha }}"

      - name: Build Tag
        run: tools/htn_fota/.venv/bin/python tools/htn_fota/fw_release.py build tag --note "CI ${{ github.sha }}"

      - name: VERSION check
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/htn_fota/.venv/bin/python tools/htn_fota/fw_release.py ci-check-version

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            releases/*/*/*.bin
            releases/*/*/*.hex
            releases/*/*/*.elf
            releases/*/*/manifest.json

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/htn_fota/.venv/bin/python tools/htn_fota/fw_release.py ci-publish
