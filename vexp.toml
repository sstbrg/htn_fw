# vexp configuration
# See https://vexp.dev/docs for options

[index]
# Drivers/ is the vendored ST HAL/CMSIS (large and not ours). Debug/ and
# Release/ hold the generated CubeIDE makefiles and build outputs.
exclude_patterns = [
    "*/Drivers/**",
    "*/Debug/**",
    "*/Release/**",
    ".claude/**",
    ".vexp/**",
]
